# .github/workflows/pr-preview.yml

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # --- JOB 1: RESPONSÁVEL PELA VALIDAÇÃO E BUILD ---
  build_and_test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    
    steps:
      # Baixa o código do repositório
      - name: Checkout Code
        uses: actions/checkout@v4

      # Instala dependências
      - name: Install Dependencies
        run: npm ci

      # Roda os testes
      - name: Run Tests
        run: npm test -- --watchAll=false

      # Gera a build de produção
      - name: Build Application
        run: npm run build

      # PASSO CRUCIAL: Faz o upload da pasta 'build' como um artefato
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files # Nome do artefato (pode ser qualquer nome)
          path: build/     # Caminho para a pasta que será 'empacotada'

  # --- JOB 2: RESPONSÁVEL PELO DEPLOY ---
  deploy_to_preview:
    # A MÁGICA ACONTECE AQUI: Este job só começa se o job 'build_and_test' terminar com sucesso
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      # PASSO CRUCIAL: Baixa o artefato que foi gerado no job anterior
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files # O mesmo nome usado no upload

      # Opcional: Listar arquivos para confirmar que o download funcionou
      - name: List files
        run: ls -R

      # Executa a ação de deploy do Firebase
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOKINGUP_665F9 }}
          projectId: cookingup-665f9