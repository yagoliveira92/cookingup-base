name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Passo 1: Instalar dependências de forma limpa e confiável
      - name: Install Dependencies
        run: npm ci

      # Passo 2: Rodar testes para garantir a qualidade do código
      - name: Run Tests
        run: npm run teste

      # Passo 3: Fazer o build da aplicação somente se os testes passarem
      - name: Build Application
        run: npm run build
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOKINGUP_665F9 }}
          projectId: cookingup-665f9
